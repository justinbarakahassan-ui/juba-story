services:
  - type: web
    name: juba-story
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: JUBA_STORY_DB
        value: /app/juba_story.db
      - key: FOUNDER_PASSWORD_HASH
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "16777216"
